# Site principal: larissafreitasugc.com.br
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # imagens, CSS e JS ficam em cache no navegador por 7 dias
    location ~* \.(css|js|png|jpe?g|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

# Página de links: link.larissafreitasugc.com.br
server {
    listen 80;
    server_name link.larissafreitasugc.com.br;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = / {
        try_files /links/index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpe?g|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
